  <text x='140' y='142' fill='#191F28' font-family='Pretendard, sans-serif' font-size='24' font-weight='800'>List (카카오뱅크 리스트)</text>
  <text x='140' y='168' fill='#76808E' font-family='Pretendard, sans-serif' font-size='14'>금융 계좌 거래 내역 및 정보 행 목록</text>

