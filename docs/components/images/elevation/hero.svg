<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGradient' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFDF0'/>
      <stop offset='50%' stop-color='#F8F9FA'/>
      <stop offset='100%' stop-color='#EDF0F3'/>
    </linearGradient>
    <filter id='cardShadow' x='-10%' y='-10%' width='120%' height='125%'>
      <feDropShadow dx='0' dy='12' stdDeviation='16' flood-color='#191F28' flood-opacity='0.06'/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width='800' height='480' fill='url(#bgGradient)'/>

  <!-- Decorative KakaoBank Accent Glow -->
  <circle cx='680' cy='80' r='140' fill='#FFE100' opacity='0.18'/>
  <circle cx='100' cy='400' r='120' fill='#FFE100' opacity='0.12'/>

  <!-- Main Showcase Container Card -->
  <rect x='100' y='40' width='600' height='400' rx='28' fill='#FFFFFF' stroke='#E5E8EB' stroke-width='1.5' filter='url(#cardShadow)'/>

  <!-- KakaoBank Header Tag -->
  <rect x='140' y='75' width='120' height='32' rx='8' fill='#FFE100'/>
  <text x='200' y='96' fill='#191F28' font-family='Pretendard, sans-serif' font-size='13' font-weight='bold' text-anchor='middle'>kakaobank</text>

  <!-- Title & Description -->
  <text x='140' y='142' fill='#191F28' font-family='Pretendard, sans-serif' font-size='24' font-weight='800'>Elevation (카카오뱅크 입체감 & 그림자)</text>
  <text x='140' y='168' fill='#76808E' font-family='Pretendard, sans-serif' font-size='14'>0~5단계 모던 핀테크 카드 뎁스 시스템</text>

  <!-- Component Interactive Graphic -->
  
            <rect x='170' y='200' width='120' height='100' rx='16' fill='#FFFFFF' stroke='#E5E8EB' filter='drop-shadow(0 2px 4px rgba(0,0,0,0.04))'/>
            <text x='230' y='255' fill='#4E5968' font-family='Pretendard, sans-serif' font-size='15' font-weight='bold' text-anchor='middle'>Level 1</text>
            <rect x='310' y='190' width='130' height='115' rx='18' fill='#FFFFFF' stroke='#FFE100' stroke-width='1.5' filter='drop-shadow(0 8px 20px rgba(0,0,0,0.08))'/>
            <text x='375' y='250' fill='#191F28' font-family='Pretendard, sans-serif' font-size='16' font-weight='bold' text-anchor='middle'>Level 2</text>
            <text x='375' y='275' fill='#FFE100' font-family='Pretendard, sans-serif' font-size='12' font-weight='bold' text-anchor='middle'>Signature Card</text>
            <rect x='460' y='180' width='140' height='130' rx='20' fill='#FFFFFF' filter='drop-shadow(0 16px 36px rgba(0,0,0,0.14))'/>
            <text x='530' y='250' fill='#191F28' font-family='Pretendard, sans-serif' font-size='16' font-weight='bold' text-anchor='middle'>Level 4</text>
            <text x='530' y='275' fill='#8B95A1' font-family='Pretendard, sans-serif' font-size='12' text-anchor='middle'>Modal Dialog</text>
        

  <!-- Footer Subtle Watermark -->
  <text x='660' y='410' fill='#B0B8C1' font-family='Pretendard, sans-serif' font-size='12' font-weight='600' text-anchor='end'>KakaoBank Material Web M3</text>
</svg>