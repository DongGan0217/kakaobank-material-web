<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGradient' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFDF0'/>
      <stop offset='50%' stop-color='#F8F9FA'/>
      <stop offset='100%' stop-color='#EDF0F3'/>
    </linearGradient>
    <filter id='cardShadow' x='-10%' y='-10%' width='120%' height='125%'>
      <feDropShadow dx='0' dy='12' stdDeviation='16' flood-color='#191F28' flood-opacity='0.06'/>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width='800' height='480' fill='url(#bgGradient)'/>

  <!-- Decorative KakaoBank Accent Glow -->
  <circle cx='680' cy='80' r='140' fill='#FFE100' opacity='0.18'/>
  <circle cx='100' cy='400' r='120' fill='#FFE100' opacity='0.12'/>

  <!-- Main Showcase Container Card -->
  <rect x='100' y='40' width='600' height='400' rx='28' fill='#FFFFFF' stroke='#E5E8EB' stroke-width='1.5' filter='url(#cardShadow)'/>

  <!-- KakaoBank Header Tag -->
  <rect x='140' y='75' width='120' height='32' rx='8' fill='#FFE100'/>
  <text x='200' y='96' fill='#191F28' font-family='Pretendard, sans-serif' font-size='13' font-weight='bold' text-anchor='middle'>kakaobank</text>

  <!-- Title & Description -->
  <text x='140' y='142' fill='#191F28' font-family='Pretendard, sans-serif' font-size='24' font-weight='800'>Menu (카카오뱅크 메뉴)</text>
  <text x='140' y='168' fill='#76808E' font-family='Pretendard, sans-serif' font-size='14'>금융 관리 및 부가 기능 드롭다운 팝업</text>

  <!-- Component Interactive Graphic -->
  
            <rect x='250' y='170' width='300' height='160' rx='20' fill='#FFFFFF' stroke='#E5E8EB' filter='drop-shadow(0 12px 32px rgba(0,0,0,0.12))'/>
            <rect x='260' y='180' width='280' height='44' rx='12' fill='#F8F9FA'/>
            <text x='280' y='208' fill='#191F28' font-family='Pretendard, sans-serif' font-size='14' font-weight='bold'>거래 내역 엑셀 다운로드</text>
            <text x='280' y='252' fill='#4E5968' font-family='Pretendard, sans-serif' font-size='14'>계좌 관리 및 한도 변경</text>
            <text x='280' y='296' fill='#F04452' font-family='Pretendard, sans-serif' font-size='14'>자동이체 해지</text>
        

  <!-- Footer Subtle Watermark -->
  <text x='660' y='410' fill='#B0B8C1' font-family='Pretendard, sans-serif' font-size='12' font-weight='600' text-anchor='end'>KakaoBank Material Web M3</text>
</svg>